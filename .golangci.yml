version: "2"
linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - revive
    - gocritic
    - bodyclose
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - dupl
      # A deferred/best-effort Close() on any connection, file, or listener is a well-known, deliberate exception
      # in this codebase, not a bug - matched by message text instead of an exhaustive per-type list, so a new
      # type with a Close() method never needs a new entry here.
      - linters:
          - errcheck
        text: '^Error return value of .*\.Close. is not checked$'
