version: "2"
linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - revive
    - gocritic
    - bodyclose
    - unused
  settings:
    errcheck:
      # A deferred/best-effort Close() on a connection or file we're about to
      # discard anyway is a well-known, deliberate exception, not a bug.
      exclude-functions:
        - (net.Conn).Close
        - (net.Listener).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*github.com/asmanya/p2p-file-distribution/internal/storage.File).Close
        - (*github.com/asmanya/p2p-file-distribution/internal/peer.Conn).Close
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - dupl
